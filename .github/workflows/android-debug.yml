name: Android Debug APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      VITE_CONVEX_URL: ${{ vars.VITE_CONVEX_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install web dependencies
        run: npm install

      - name: Validate Convex URL
        run: |
          test -n "$VITE_CONVEX_URL" || (echo "Missing repository variable VITE_CONVEX_URL" && exit 1)

      - name: Add Android platform
        run: npx cap add android

      - name: Build web app and sync Capacitor
        run: npm run android:sync

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: willy-yemek-tarifi-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
